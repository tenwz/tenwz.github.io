---
permalink: /feed
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>芦苇 Feed</title>
</head>
<body>
{% assign txt_files = site.static_files | where: "extname", ".txt" | sort: "path" %}{% for f in txt_files %}
<template data-file="{{ f.path | relative_url | escape }}"></template>{% endfor %}
<pre id="feed"></pre>
<script>
const files = [...document.querySelectorAll('[data-file]')];
Promise.all(files.map(file => fetch(file.dataset.file).then(response => response.text())))
  .then(text => document.querySelector('#feed').textContent = text.join('\n\n\n'));
</script>
</body>
</html>
