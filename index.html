<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>芦苇</title>
</head>
<body>
{% assign txt_files = site.static_files | where: "extname", ".txt" | sort: "path" %}{% for f in txt_files %}
<h2>{{ f.name | remove: ".txt" }}</h2>
<pre data-file="{{ f.path | relative_url | escape }}"></pre>{% endfor %}
<script>
document.querySelectorAll('[data-file]').forEach(async el => {
  el.textContent = await fetch(el.dataset.file).then(response => response.text());
});
</script>
</body>
</html>
